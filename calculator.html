<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input id="display" type="text" readonly value="0" />

      <div class="buttons">
        <button class="clear" data-action="clear">C</button>
        <button data-action="delete">DEL</button>
        <button class="operator" data-action="/">/</button>
        <button class="operator" data-action="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-action="-">-</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-action="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="equal" data-action="=">=</button>

        <button data-value="0" style="grid-column: span 2;">0</button>
        <button data-value=".">.</button>
      </div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
